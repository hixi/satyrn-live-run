[project]
name = "satyrn-live-run"
version = "0.1.0"
description = "Run satyrn-engine from the current checkout, as a versioned dependency overridden to a local path"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["satyrn-engine>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satyrn_live_run"]

[dependency-groups]
dev = ["pytest>=8.3.4"]

[tool.uv.sources]
satyrn-engine = { path = "../satyrn-engine", editable = true }

[tool.satyrn]
self_test = ["uv", "run", "python", "-m", "pytest", "-q"]

[tool.pytest.ini_options]
addopts = []
